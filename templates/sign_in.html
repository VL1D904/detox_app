<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <script src="https://kit.fontawesome.com/00a1759899.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/detox.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/authentificate.css')}}">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.ico')}}">
</head>
<body>
    <main>
        <form action="" method="post">
            <img src="{{ url_for('static', filename='images/logo.png')}}" alt="">
            <h1>Вход</h1>
            <p>Логин или почта</p>
            <input type="text" placeholder="example" name="login">
            <p>Пароль</p>
            <input type="password" placeholder="123" name="password">
            {% if login_failed: %}
            <p class="error" style="display: block;">Неверный логин или пароль</p>
            {% endif %}
            <button>Войти</button>
            <span>Нет аккаунта? <a href="/sign_up">Зарегистрируйтесь</a></span>
            <a href="/forgot_password">Забыли пароль?</a>
            <section class="anotherEnter">
                <h5>Войти с помощью</h5>
                <article>
                    <a  href="/authorize/google">
                        <i class="fa-brands fa-google"></i>
                    </a>
                    <a  href="/authorize/yandex">
                        <i class="fa-brands fa-yandex"></i>
                    </a>
                    <a href="/authorize/github">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </article>
            </section>
        </form>
    </main>
</body>
</html>
